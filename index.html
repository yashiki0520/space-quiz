<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Orbit Quiz — A little space adventure</title>
  <style>
    :root {
      color-scheme: light;
      --page: #f5f4ff;
      --surface: #fff;
      --surface-soft: #f7f6fc;
      --ink: #24213b;
      --muted: #77758d;
      --line: #e9e7f2;
      --purple: #7055e8;
      --purple-dark: #5b41d0;
      --purple-pale: #eeebff;
      --green: #157650;
      --green-ink: #fff;
      --green-pale: #e2f7ed;
      --red: #b13b49;
      --red-ink: #fff;
      --red-pale: #ffeaec;
      --button-ink: #fff;
      --hud-accent: #287d91;
      --hud-grid: rgb(67 101 132 / 6%);
      --hud-line: rgb(54 103 133 / 18%);
      --shadow: 0 24px 70px rgb(46 35 105 / 10%), 0 3px 12px rgb(46 35 105 / 5%);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: dark;
        --page: #171625;
        --surface: #222132;
        --surface-soft: #2b293b;
        --ink: #f5f3ff;
        --muted: #aaa7bd;
        --line: #3a374d;
        --purple: #a393ff;
        --purple-dark: #b2a6ff;
        --purple-pale: #383250;
        --green: #66d5a4;
        --green-ink: #10261d;
        --green-pale: #233e37;
        --red: #ff8290;
        --red-ink: #38171d;
        --red-pale: #472d39;
        --button-ink: #201a39;
        --hud-accent: #82dce5;
        --hud-grid: rgb(130 220 229 / 6%);
        --hud-line: rgb(130 220 229 / 22%);
        --shadow: 0 24px 70px rgb(0 0 0 / 28%), 0 3px 12px rgb(0 0 0 / 12%);
      }
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 38px 20px;
      display: grid;
      place-items: center;
      background:
        radial-gradient(ellipse at 12% 12%, rgb(166 149 255 / 17%), transparent 32%),
        radial-gradient(ellipse at 88% 86%, rgb(255 185 201 / 15%), transparent 30%),
        var(--page);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 15px;
      line-height: 1.5;
      transition: background-color 180ms ease, color 180ms ease;
    }

    button { font: inherit; }

    .app {
      width: min(100%, 560px);
      margin: auto;
    }

    .brand {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 9px;
      margin: 0 0 22px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .13em;
      text-transform: uppercase;
    }

    .brand-mark {
      display: grid;
      width: 30px;
      height: 30px;
      place-items: center;
      border-radius: 10px;
      background: var(--purple-pale);
      font-size: 17px;
      letter-spacing: 0;
    }

    .card {
      position: relative;
      overflow: hidden;
      padding: 34px 38px 30px;
      border: 1px solid var(--hud-line);
      border-radius: 18px;
      background:
        linear-gradient(var(--hud-grid) 1px, transparent 1px),
        linear-gradient(90deg, var(--hud-grid) 1px, transparent 1px),
        var(--surface);
      background-size: 28px 28px, 28px 28px, auto;
      box-shadow: var(--shadow);
      animation: arrive 450ms cubic-bezier(.2,.8,.2,1) both;
    }

    .card::before {
      position: absolute;
      inset: 0 0 auto;
      height: 3px;
      background: linear-gradient(90deg, var(--hud-accent), var(--purple) 58%, transparent);
      content: "";
    }

    @keyframes arrive {
      from { opacity: 0; transform: translateY(10px) scale(.99); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .topline {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      margin: -2px 0 14px;
      padding-bottom: 13px;
      border-bottom: 1px solid var(--hud-line);
      color: var(--hud-accent);
      font-family: ui-monospace, "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .055em;
      text-transform: uppercase;
    }

    #question-count::before {
      display: inline-block;
      width: 7px;
      height: 7px;
      margin-right: 8px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 0 3px var(--green-pale);
      content: "";
      vertical-align: 1px;
    }

    #score-label {
      padding: 5px 9px;
      border: 1px solid var(--hud-line);
      border-radius: 7px;
      background: var(--surface-soft);
      color: var(--ink);
      white-space: nowrap;
    }

    .progress-track {
      height: 9px;
      overflow: hidden;
      border: 1px solid var(--hud-line);
      border-radius: 4px;
      background: var(--surface-soft);
    }

    .progress-fill {
      width: 0;
      height: 100%;
      border-radius: 2px;
      background:
        repeating-linear-gradient(115deg, transparent 0 7px, rgb(255 255 255 / 20%) 7px 9px),
        linear-gradient(90deg, var(--hud-accent), var(--purple));
      transition: width 420ms cubic-bezier(.2,.8,.2,1);
    }

    .question-area { padding-top: 29px; }

    .eyebrow {
      margin: 0 0 11px;
      padding-left: 9px;
      border-left: 2px solid var(--hud-accent);
      color: var(--hud-accent);
      font-size: 12px;
      font-weight: 750;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    h1, h2 {
      margin: 0;
      font-size: clamp(23px, 5vw, 29px);
      letter-spacing: -.035em;
      line-height: 1.25;
    }

    .prompt {
      margin: 10px 0 23px;
      color: var(--muted);
      font-size: 15px;
    }

    .answers {
      display: grid;
      gap: 11px;
    }

    .answer {
      width: 100%;
      min-height: 54px;
      display: flex;
      align-items: center;
      gap: 13px;
      padding: 11px 15px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: color-mix(in srgb, var(--surface) 94%, var(--hud-accent));
      color: var(--ink);
      cursor: pointer;
      text-align: left;
      transition: border-color 160ms ease, background 160ms ease, transform 160ms ease, box-shadow 160ms ease;
    }

    .answer:not(:disabled):hover {
      transform: translateY(-1px);
      border-color: var(--purple);
      box-shadow: 0 4px 14px rgb(112 85 232 / 10%);
    }

    .answer:focus-visible, .next-button:focus-visible {
      outline: 3px solid var(--purple);
      outline-offset: 3px;
    }

    .answer:disabled { cursor: default; }

    .answer-letter {
      display: grid;
      flex: 0 0 28px;
      width: 28px;
      height: 28px;
      place-items: center;
      border-radius: 9px;
      background: var(--surface-soft);
      color: var(--muted);
      font-size: 12px;
      font-weight: 750;
      font-family: ui-monospace, "SFMono-Regular", Consolas, "Liberation Mono", monospace;
    }

    .answer.correct {
      border-color: var(--green);
      background: var(--green-pale);
      color: var(--ink);
      animation: pop 360ms cubic-bezier(.2,1.5,.5,1) both;
    }

    .answer.correct .answer-letter {
      background: var(--green);
      color: var(--green-ink);
    }

    .answer.wrong {
      border-color: var(--red);
      background: var(--red-pale);
      color: var(--ink);
      animation: shake 380ms ease both;
    }

    .answer.wrong .answer-letter {
      background: var(--red);
      color: var(--red-ink);
    }

    .answer.reveal {
      border-color: var(--green);
      background: var(--green-pale);
    }

    @keyframes pop {
      0% { transform: scale(1); }
      45% { transform: scale(1.025); }
      100% { transform: scale(1); }
    }

    @keyframes shake {
      15%, 55%, 95% { transform: translateX(-5px); }
      35%, 75% { transform: translateX(5px); }
      100% { transform: translateX(0); }
    }

    .feedback {
      min-height: 48px;
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 13px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    .feedback.good { color: var(--green); font-weight: 650; }
    .feedback.bad { color: var(--red); font-weight: 650; }

    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-top: 8px;
      padding-top: 17px;
      border-top: 1px solid var(--line);
    }

    .score {
      color: var(--muted);
      font-size: 14px;
      font-weight: 650;
    }

    .score strong { color: var(--ink); }

    .next-button {
      min-width: 132px;
      min-height: 45px;
      padding: 10px 18px;
      border: 0;
      border: 1px solid var(--purple);
      border-radius: 9px;
      background: linear-gradient(135deg, var(--purple), var(--purple-dark));
      color: var(--button-ink);
      cursor: pointer;
      font-weight: 700;
      transition: transform 160ms ease, filter 160ms ease;
    }

    .next-button:not(:disabled):hover { transform: translateY(-1px); filter: brightness(1.06); }
    .next-button:disabled { cursor: not-allowed; opacity: .42; }

    .results {
      padding: 15px 4px 4px;
      text-align: center;
    }

    .reaction {
      width: 104px;
      height: 104px;
      display: grid;
      place-items: center;
      margin: 5px auto 20px;
      border-radius: 34px;
      background: var(--purple-pale);
      font-size: 57px;
      animation: pop 500ms cubic-bezier(.2,1.5,.5,1) both;
    }

    .results h1 { margin-bottom: 9px; }
    .result-copy { margin: 0 auto; max-width: 390px; color: var(--muted); }

    .final-score {
      margin: 24px auto 25px;
      padding: 17px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--surface-soft);
    }

    .final-score strong {
      display: block;
      color: var(--purple);
      font-size: 32px;
      letter-spacing: -.04em;
      line-height: 1.2;
    }

    .final-score span { color: var(--muted); font-size: 13px; }
    .results .next-button { width: 100%; }
    .hidden { display: none !important; }

    .bottom-note {
      margin: 17px 0 0;
      color: var(--muted);
      font-size: 12px;
      text-align: center;
    }

    @media (max-width: 480px) {
      body { padding: 24px 15px; }
      .brand { margin-bottom: 16px; }
      .card { padding: 27px 22px 23px; border-radius: 16px; }
      .question-area { padding-top: 25px; }
      .answer { min-height: 52px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <div class="brand" aria-label="Orbit Quiz">
      <span class="brand-mark" aria-hidden="true">✦</span>
      <span>Orbit Quiz</span>
    </div>

    <section class="card" aria-label="Space exploration quiz">
      <div id="quiz-screen">
        <div class="topline">
          <span id="question-count">Question 1 of 10</span>
          <span id="score-label">⭐ <span id="score">0</span> points</span>
        </div>
        <div
          class="progress-track"
          id="progress-track"
          role="progressbar"
          aria-label="Quiz progress"
          aria-valuemin="0"
          aria-valuemax="10"
          aria-valuenow="0"
        >
          <div class="progress-fill" id="progress-fill"></div>
        </div>

        <div class="question-area" aria-live="polite">
          <p class="eyebrow" id="category">The solar system</p>
          <h1 id="question" tabindex="-1">Loading your first question…</h1>
          <p class="prompt">Choose the best answer to continue.</p>
          <div class="answers" id="answers"></div>
          <p class="feedback" id="feedback" role="status" aria-live="polite"></p>
        </div>

        <div class="card-footer">
          <span class="score">Score: <strong id="score-footer">0</strong> / 10</span>
          <button class="next-button" id="next-button" type="button" disabled>Check answer</button>
        </div>
      </div>

      <div class="results hidden" id="results-screen" aria-live="polite">
        <div class="reaction" id="reaction" aria-hidden="true">🚀</div>
        <p class="eyebrow">Mission complete</p>
        <h1 id="result-title">Out of this world!</h1>
        <p class="result-copy" id="result-copy"></p>
        <div class="final-score">
          <strong id="final-score">0 / 10</strong>
          <span>correct answers</span>
        </div>
        <button class="next-button" id="restart-button" type="button">Play again ↻</button>
      </div>
    </section>

    <p class="bottom-note">A tiny trip through the cosmos · No spacesuit required</p>
  </main>

  <script>
    (() => {
      const questions = [
        {
          category: "The solar system",
          question: "Which planet is known as the Red Planet?",
          options: ["Venus", "Mars", "Mercury", "Jupiter"],
          answer: 1,
          fact: "Mars looks red because its surface is rich in rusty iron oxide."
        },
        {
          category: "Moon matters",
          question: "What is the name of the first person to walk on the Moon?",
          options: ["Buzz Aldrin", "Yuri Gagarin", "Neil Armstrong", "John Glenn"],
          answer: 2,
          fact: "Neil Armstrong took humanity's first steps on the Moon in 1969."
        },
        {
          category: "Star stuff",
          question: "What is the closest star to Earth?",
          options: ["Sirius", "The Sun", "Proxima Centauri", "Polaris"],
          answer: 1,
          fact: "Our Sun is a star, and it is about 150 million kilometers away."
        },
        {
          category: "Giant worlds",
          question: "Which planet has the most prominent ring system?",
          options: ["Saturn", "Neptune", "Earth", "Mars"],
          answer: 0,
          fact: "Saturn's beautiful rings are made mostly of ice and rocky debris."
        },
        {
          category: "Deep space",
          question: "What is a galaxy?",
          options: ["A group of planets", "A cloud of only gas", "A huge collection of stars, gas, and dust", "A kind of comet"],
          answer: 2,
          fact: "Our Sun lives in the Milky Way, a galaxy with billions of stars."
        },
        {
          category: "Space travel",
          question: "What was the first artificial satellite sent into space?",
          options: ["Voyager 1", "Sputnik 1", "Hubble", "Apollo 11"],
          answer: 1,
          fact: "The Soviet Union launched Sputnik 1 into orbit in 1957."
        },
        {
          category: "Our cosmic home",
          question: "Which planet is famous for its Great Red Spot?",
          options: ["Uranus", "Venus", "Jupiter", "Saturn"],
          answer: 2,
          fact: "Jupiter's Great Red Spot is a giant storm that has raged for centuries."
        },
        {
          category: "Moon matters",
          question: "About how long does it take the Moon to orbit Earth?",
          options: ["One day", "About one month", "One year", "Ten years"],
          answer: 1,
          fact: "The Moon completes an orbit around Earth in about 27 days."
        },
        {
          category: "Space explorers",
          question: "What does a rover do on Mars?",
          options: ["Collects science data on the surface", "Carries astronauts to Earth", "Creates new stars", "Keeps Mars warm"],
          answer: 0,
          fact: "Robotic rovers explore the Martian surface and send their findings home."
        },
        {
          category: "Beyond the planets",
          question: "What is a light-year a measure of?",
          options: ["Time", "Brightness", "Distance", "Temperature"],
          answer: 2,
          fact: "A light-year is the distance light travels in one year: nearly 9.5 trillion km."
        }
      ];

      const questionCount = document.getElementById("question-count");
      const progressTrack = document.getElementById("progress-track");
      const progressFill = document.getElementById("progress-fill");
      const category = document.getElementById("category");
      const questionTitle = document.getElementById("question");
      const answers = document.getElementById("answers");
      const feedback = document.getElementById("feedback");
      const nextButton = document.getElementById("next-button");
      const scoreDisplay = document.getElementById("score");
      const scoreFooter = document.getElementById("score-footer");
      const quizScreen = document.getElementById("quiz-screen");
      const resultsScreen = document.getElementById("results-screen");

      let current = 0;
      let score = 0;
      let answered = false;

      function renderQuestion() {
        const item = questions[current];
        answered = false;
        questionCount.textContent = `Question ${current + 1} of ${questions.length}`;
        progressTrack.setAttribute("aria-valuenow", String(current));
        progressFill.style.width = `${(current / questions.length) * 100}%`;
        category.textContent = item.category;
        questionTitle.textContent = item.question;
        feedback.textContent = "";
        feedback.className = "feedback";
        nextButton.disabled = true;
        nextButton.textContent = "Check answer";
        answers.replaceChildren();

        item.options.forEach((option, index) => {
          const button = document.createElement("button");
          button.type = "button";
          button.className = "answer";
          button.dataset.index = String(index);
          button.setAttribute("aria-label", `${String.fromCharCode(65 + index)}. ${option}`);
          button.innerHTML = `<span class="answer-letter">${String.fromCharCode(65 + index)}</span><span>${option}</span>`;
          button.addEventListener("click", () => selectAnswer(index));
          answers.append(button);
        });
      }

      function selectAnswer(selected) {
        if (answered) return;
        answered = true;
        const item = questions[current];
        const buttons = [...answers.querySelectorAll(".answer")];
        const isCorrect = selected === item.answer;
        progressTrack.setAttribute("aria-valuenow", String(current + 1));
        progressFill.style.width = `${((current + 1) / questions.length) * 100}%`;

        buttons.forEach((button, index) => {
          button.disabled = true;
          if (index === item.answer) button.classList.add("correct");
          if (index === selected && !isCorrect) button.classList.add("wrong");
        });

        if (isCorrect) {
          score += 1;
          feedback.textContent = `✨ Correct! ${item.fact}`;
          feedback.classList.add("good");
        } else {
          feedback.textContent = `Not quite — ${item.fact}`;
          feedback.classList.add("bad");
        }

        scoreDisplay.textContent = String(score);
        scoreFooter.textContent = String(score);
        nextButton.disabled = false;
        nextButton.textContent = current === questions.length - 1 ? "See my results" : "Next question";
      }

      function showResults() {
        progressTrack.setAttribute("aria-valuenow", String(questions.length));
        progressFill.style.width = "100%";
        document.getElementById("final-score").textContent = `${score} / ${questions.length}`;

        let emoji;
        let title;
        let copy;
        if (score === questions.length) {
          emoji = "🏆";
          title = "Out of this world!";
          copy = "A perfect mission! You really know your way around the cosmos.";
        } else if (score >= 7) {
          emoji = "🧑‍🚀";
          title = "Stellar work!";
          copy = "You’re a brilliant space explorer. The universe is lucky to have you.";
        } else if (score >= 4) {
          emoji = "🪐";
          title = "Nice orbit!";
          copy = "You’ve got a great start. There’s always more to discover out there.";
        } else {
          emoji = "🌱";
          title = "Space cadet in training!";
          copy = "Every explorer starts somewhere. Ready to take another trip?";
        }

        document.getElementById("reaction").textContent = emoji;
        document.getElementById("result-title").textContent = title;
        document.getElementById("result-copy").textContent = copy;
        quizScreen.classList.add("hidden");
        resultsScreen.classList.remove("hidden");
        document.getElementById("restart-button").focus();
      }

      nextButton.addEventListener("click", () => {
        if (!answered) return;
        if (current < questions.length - 1) {
          current += 1;
          renderQuestion();
          questionTitle.focus?.();
        } else {
          showResults();
        }
      });

      document.getElementById("restart-button").addEventListener("click", () => {
        current = 0;
        score = 0;
        scoreDisplay.textContent = "0";
        scoreFooter.textContent = "0";
        resultsScreen.classList.add("hidden");
        quizScreen.classList.remove("hidden");
        renderQuestion();
        answers.querySelector("button")?.focus();
      });

      renderQuestion();
    })();
  </script>
</body>
</html>
